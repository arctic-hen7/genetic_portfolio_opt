[package]
name = "genetic_portfolio_opt"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
genetic = { version = "0.1", git = "ssh://git@github.com/arctic-hen7/genetic.git" }
libc = "0.2.172"
ordered-float = "5.0.0"
rand = "0.9.1"
rand_distr = "0.5.1"
rayon = "1.10.0"
thiserror = "2.0.12"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
